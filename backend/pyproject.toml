
[project]
name = "taskora"
version = "0.1.0"
description = "A scalable, multi-tenant project management and team collaboration platform."
readme = "../README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<4.0",
    "django-filter>=25.1,<26.0",
    "django-cors-headers>=4.7,<5.0",
    "django-environ>=0.12,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pillow>=11.0,<13.0",
    "djangorestframework-simplejwt>=5.5,<6.0",
    "cryptography>=44.0,<47.0",
    "celery[redis]>=5.5,<6.0",
    "django-celery-results>=2.6,<3.0",
    "django-celery-beat>=2.8,<3.0",
    "django-redis>=5.4,<7.0",
    "redis>=5.2,<7.0",
    "drf-spectacular>=0.28,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-django>=4.11,<5.0",
    "black>=25.1,<27.0",
    "flake8>=7.1,<8.0",
    "django-debug-toolbar>=6.0,<7.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_tests.py", "tests.py"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.flake8]
max-line-length = 100
exclude = [".git", ".venv", "__pycache__", "migrations"]
